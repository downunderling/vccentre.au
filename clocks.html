<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Clocks | The Video Conferencing Centre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">THE VIDEOCONFERENCING CENTRE</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="courts-tribunals.html">Courts & Tribunals</a>
        <a href="contact.html">Contact</a>
        <a href="clocks.html" class="active">Clocks</a>
      </nav>
    </div>
  </header>

  <main>
    <h1>Australian Time Zones</h1>
    <div class="clocks-grid" id="clocks-container">
      <!-- Clocks will be generated by JavaScript -->
    </div>
  </main>

  <footer>
    <p>PROFESSIONAL QUALITY VIDEO CONFERENCING</p>
    <p>Across Australia and Worldwide</p>
  </footer>

  <script>
    const cities = [
      { name: "Melbourne", tz: "Australia/Melbourne" },
      { name: "Sydney",    tz: "Australia/Sydney" },
      { name: "Darwin",    tz: "Australia/Darwin" },
      { name: "Perth",     tz: "Australia/Perth" },
      { name: "Adelaide",  tz: "Australia/Adelaide" },
      { name: "Hobart",    tz: "Australia/Hobart" }
    ];

    const container = document.getElementById("clocks-container");

    // Create clock cards
    cities.forEach((city, index) => {
      const card = document.createElement("div");
      card.className = "clock-card";
      card.innerHTML = `
        <h2>${city.name}</h2>
        <div class="clock-face" id="face-${index}">
          <div class="hand hour-hand" id="hour-${index}"></div>
          <div class="hand minute-hand" id="minute-${index}"></div>
          <div class="hand second-hand" id="second-${index}"></div>
        </div>
        <div class="digital-time" id="digital-${index}">--:--:--</div>
      `;
      container.appendChild(card);
    });

    function updateClocks() {
      const now = new Date();

      cities.forEach((city, index) => {
        // Get time parts in the target timezone
        const timeStr = now.toLocaleTimeString("en-AU", {
          timeZone: city.tz,
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });

        document.getElementById(`digital-${index}`).textContent = timeStr;

        // Parse hours, minutes, seconds
        const [h, m, s] = timeStr.split(":").map(Number);

        // Calculate angles
        const secondDeg = s * 6;
        const minuteDeg = m * 6 + s * 0.1;
        const hourDeg = (h % 12) * 30 + m * 0.5;

        document.getElementById(`hour-${index}`).style.transform = `rotate(${hourDeg}deg)`;
        document.getElementById(`minute-${index}`).style.transform = `rotate(${minuteDeg}deg)`;
        document.getElementById(`second-${index}`).style.transform = `rotate(${secondDeg}deg)`;
      });
    }

    // Initial update + every second
    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
